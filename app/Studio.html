<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mentor — Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="../cli/mentor-core.js"></script>
<style>
  :root{
    --bg:#0b1220; --panel:#101827; --card:#141e30; --border:rgba(148,163,184,.18);
    --text:#e5edf7; --muted:#93a4b8; --line:rgba(148,163,184,.28);
    --blue:#6d7cff; --green:#34d399; --amber:#fbbf24; --red:#fb7185;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);
    background:radial-gradient(circle at 50% 0%,rgba(109,124,255,.16),transparent 34%),var(--bg);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
  .page{max-width:1140px;margin:0 auto;padding:30px 22px 120px}
  .eyebrow{font-size:12px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted)}
  h1{margin:6px 0 0;font-size:26px;letter-spacing:-.03em}
  .rail{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 22px}
  .pip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);cursor:pointer}
  .pip.active{background:linear-gradient(135deg,var(--blue),#7c3aed);border-color:transparent;color:#fff}
  .pip.done{color:#bbf7d0;border-color:rgba(52,211,153,.4)}
  .wrap{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
  .step{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px 22px 8px;min-width:0}
  .step h2{margin:0;font-size:21px;letter-spacing:-.02em}
  .lead{color:var(--muted);line-height:1.65;margin:10px 0 4px}
  .lead b{color:#cdd7e6}
  .note{font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-radius:12px;padding:11px 13px;margin:14px 0}
  /* help panel */
  .help{position:sticky;top:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px 16px 18px;max-height:calc(100vh - 90px);overflow:auto}
  .help .tag{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);font-weight:700}
  .help h3{margin:4px 0 2px;font-size:15.5px;letter-spacing:-.01em}
  .help p{color:var(--muted);line-height:1.62;font-size:13px;margin:9px 0}
  .help p b{color:#cdd7e6}
  .help .ex{background:rgba(109,124,255,.10);border:1px solid rgba(109,124,255,.3);border-radius:10px;
    padding:9px 11px;font-size:12.5px;color:#dfe5ff;margin-top:10px;line-height:1.55}
  .help .ex b{color:#fff}
  .help code{color:#cdd7e6}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  input,select,textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:9px 11px;font:inherit;font-size:13px}
  textarea{resize:vertical;min-height:48px}
  .row{display:grid;gap:10px}
  .c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:1fr 1fr 1fr 1fr}
  .item{border:1px solid var(--border);border-radius:14px;padding:13px;margin:12px 0;background:var(--card)}
  .sub{border:1px dashed var(--line);border-radius:10px;padding:9px;margin:8px 0}
  .flexbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .chip{display:inline-flex;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;cursor:pointer;margin:2px 4px 2px 0;
    background:rgba(109,124,255,.16);border:1px solid rgba(109,124,255,.3)}
  .chip.off{background:rgba(255,255,255,.03);border-color:var(--border);color:var(--muted)}
  button{cursor:pointer;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.05);
    color:var(--text);padding:9px 14px;font-weight:700;font-size:13px}
  button.primary{border:none;background:linear-gradient(135deg,var(--blue),#7c3aed)}
  button.sm{padding:5px 9px;font-size:12px}
  button.danger{border-color:rgba(251,113,133,.4);color:#fecdd3}
  button:disabled{opacity:.5;cursor:not-allowed}
  .small{font-size:11.5px;color:var(--muted)}
  .warn{color:#fde68a}.ok{color:#bbf7d0}
  .foot{position:fixed;left:0;right:0;bottom:0;background:rgba(11,18,32,.92);border-top:1px solid var(--border);backdrop-filter:blur(6px)}
  .foot .inner{max-width:1140px;margin:0 auto;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  pre{background:#0a0f1a;border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto;font-size:11.5px;line-height:1.5;color:#cdd7e6;max-height:300px;white-space:pre-wrap}
  code{color:#cdd7e6}
  @media(max-width:860px){.wrap{grid-template-columns:1fr}.help{position:static;max-height:none;order:-1}}

  /* ===== Mentor Studio: results view (map · validate · compile) ===== */
  .mres-tabs{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap}
  .mres-tab{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);
    padding:8px 14px;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer}
  .mres-tab.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--blue),#7c3aed)}
  .mres{--cyan:#22d3ee;--pink:#f472b6;--purple:#a78bfa}
  .mres pre{max-height:52vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
    background:#0a0f1a;border:1px solid var(--border);border-radius:12px;padding:14px;font-size:12px;line-height:1.55;color:#cdd7e6}
  .mres-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .ftag{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.03)}
  /* map */
  .mres .layer{position:relative;margin:0 0 14px}
  .mres .conn{width:2px;height:24px;background:var(--line);margin:0 auto}
  .mres .layer-box{border:1px solid var(--border);border-radius:18px;padding:15px 17px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02))}
  .mres .layer-head{display:flex;align-items:flex-start;gap:13px}
  .mres .lv{flex-shrink:0;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:17px;background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .mres .layer-head h2{margin:0;font-size:18px;letter-spacing:-.02em}
  .mres .role{color:var(--muted);font-size:13px;margin:4px 0 0;line-height:1.5}
  .mres .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .mres .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
  .mres .pill.green{color:#bbf7d0;border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.10)}
  .mres .pill.amber{color:#fde68a;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.10)}
  .mres .pill.blue{color:#c7ccff;border-color:rgba(109,124,255,.45);background:rgba(109,124,255,.10)}
  .mres .pill.red{color:#fecdd3;border-color:rgba(251,113,133,.45);background:rgba(251,113,133,.12)}
  .mres .chip{font-size:10.5px;color:var(--muted);padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--border);cursor:default;margin:0}
  .mres .children{margin:13px 0 0;padding-top:13px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
  .mres .node{border:1px solid var(--border);border-radius:13px;padding:11px 12px;background:var(--card)}
  .mres .node h3{margin:0;font-size:13.5px;letter-spacing:-.01em}
  .mres .sum{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}
  .mres .sum b{color:#cdd7e6;font-weight:650}
  .mres .node ul{margin:6px 0 0;padding-left:15px;color:var(--muted);font-size:11.5px;line-height:1.5}
  .mres .kids{margin-top:9px;display:grid;gap:7px}
  .mres .leafrow{font-size:12px;color:var(--muted);padding:6px 9px;border:1px solid var(--border);border-radius:9px;background:rgba(255,255,255,.025)}
  .mres .leafrow b{color:#cdd7e6}
  .mres .vpanel{margin:0 0 14px;border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.55}
  .mres .vpanel.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:#bbf7d0}
  .mres .vpanel.bad{background:rgba(251,113,133,.10);border:1px solid rgba(251,113,133,.4);color:#fecdd3}
  .mres .vpanel ul{margin:6px 0 0;padding-left:18px}
  .mres .vpanel b{color:#fff}
  .mres [data-d]{cursor:pointer;transition:border-color .12s,background .12s}
  .mres .node[data-d]:hover,.mres .leafrow[data-d]:hover{border-color:var(--blue);background:rgba(109,124,255,.08)}
  .mres .layer-box[data-d]:hover{box-shadow:0 0 0 1px var(--blue) inset}
  /* detail drawer (body-level) */
  .mdbackdrop{position:fixed;inset:0;background:rgba(4,8,16,.55);opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
  .mdbackdrop.open{opacity:1;pointer-events:auto}
  .mdrawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,92vw);z-index:70;background:var(--panel);
    border-left:1px solid var(--border);box-shadow:-20px 0 50px rgba(0,0,0,.4);transform:translateX(100%);
    transition:transform .2s ease;overflow:auto;padding:20px 22px 40px}
  .mdrawer.open{transform:translateX(0)}
  .md-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
  .md-type{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan,#22d3ee)}
  .md-title{margin:4px 0 0;font-size:21px;letter-spacing:-.02em;line-height:1.15}
  .md-path{color:var(--muted);font-size:11.5px;margin-top:5px;word-break:break-all}
  .md-close{font-size:22px;line-height:1;padding:4px 11px;border-radius:11px;flex-shrink:0;
    background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);cursor:pointer}
  .md-sec{margin-top:20px}
  .md-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .df-row{display:flex;gap:10px;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(148,163,184,.10)}
  .df-row.df-block{display:block}
  .df-key{color:var(--muted);font-weight:650;flex-shrink:0}
  .df-val{color:var(--text);text-align:right;word-break:break-word}
  .df-muted{color:var(--muted)}
  .df-arr{margin:4px 0 2px 8px;display:grid;gap:6px}
  .df-item{border:1px solid var(--border);border-radius:10px;padding:7px 10px;background:rgba(255,255,255,.025)}
  .df-li{font-size:12.5px;color:var(--text);padding:3px 9px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.025)}
  .df-block .df-row{border-bottom:none}
  .md-body{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px;line-height:1.6;color:#cdd7e6;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin:0}

</style>
</head>
<body>
<main class="page">
  <div class="eyebrow">Mentor · Studio</div>
  <h1 id="htitle">Build, validate &amp; compile your model</h1>
  <div class="flexbar" style="margin-top:10px;justify-content:flex-start;gap:12px">
    <span class="small">Editing a saved model?</span>
    <label class="mres-tab" style="cursor:pointer">Import a folder to edit<input id="imppick" type="file" webkitdirectory directory multiple style="display:none"></label>
  </div>
  <div class="rail" id="rail"></div>
  <div class="wrap">
    <div class="step" id="step"></div>
    <aside class="help" id="help"></aside>
  </div>
</main>
<div class="foot"><div class="inner">
  <button id="back">← Back</button>
  <span class="small" id="hint"></span>
  <button id="next" class="primary">Next →</button>
</div></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const CHANNELS=["email","telegram","slack","sms","whatsapp","discord","signal","cli"];
const TIERS=["auto","recommend","approve"];
const OPS=[">=","<=",">","<","=="];
const PRIOS=["critical","high","medium","low"];
const slug=s=>String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
const q=s=>'"'+String(s==null?"":s).replace(/\\/g,"\\\\").replace(/"/g,'\\"')+'"';
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* ---------- state ---------- */
const state={
  business:{name:"",engine_adapter:""},
  strategic:{mission:"",tie_breaker:"escalate",tie_margin:0.05,
    objectives:[{name:"",description:"",weight:1,targets:[{metric:"",operator:">=",value:0,unit:""}],guidance:""}]},
  governance:{
    approvers:[{name:"",role:"",channels:["email"],can_approve:"all"}],
    actions:[{name:"",description:"",tier:"recommend",serves:[],domains:"",conditions:"",approver:0,escalates_to:-1,max_percent:"",max_cost:"",ccy:""}],
    hard_limits:[
      {rule:"Never move money, issue refunds, or change payouts without approval"},
      {rule:"Never share personal or customer data with third parties without approval"},
      {rule:"Never make legally binding commitments on the business's behalf without approval"},
      {rule:"Never make public or media statements as the business without approval"},
      {rule:"Never permanently delete or irreversibly destroy records without approval"},
      {rule:"Always disclose that you are an AI when asked"}
    ],
    escalation:[
      {trigger:"Safety, security, or legal emergency",priority:"critical",action:"Notify the responsible human immediately",oqh:true},
      {trigger:"An action fails repeatedly (~3x) or two agents disagree",priority:"medium",action:"Stop, log the reasoning, and escalate — do not retry blindly",oqh:false}
    ],
    notifications:{channels:["email"],window:"22:00-07:00",timezone:"UTC",priority:"critical"},
    audit:{retain_days:365}
  },
  objects:{types:[{name:"",key:"",fields:[{name:"",type:"text"}],relationships:[],states:""}]},
  domain:{agents:[{name:"",persona:"",domain:"Operations",purpose:"",actions:[],objects:[]}]},
  human:{operators:[{name:"",role:"",fulfils:[],channels:["email"],handles:"",availability:""}]},
  learning:{patterns:[{detects:"",watches:[],suggests:""}],predictions:[{predicts:"",horizon:"",informs:[]}],simulations:[{scenario:"",compares:"",scores:[],affects:[]}]}
};

const STEPS=[
  {id:"welcome",label:"Start"},{id:"strategic",label:"1 · Strategic"},{id:"governance",label:"2 · Governance"},
  {id:"objects",label:"6 · Objects"},{id:"domain",label:"5 · Domain"},{id:"human",label:"7 · Human"},
  {id:"learning",label:"3 · Learning"},{id:"core",label:"4 · Core"},{id:"generate",label:"Generate"},
];
let cur=0;
const STEP_DEFAULT={welcome:"s_welcome",strategic:"s_strategic",governance:"s_governance",learning:"s_learning",
  core:"s_core",domain:"s_domain",objects:"s_objects",human:"s_human",generate:"s_generate"};

/* explain-only layer steps */
// Only `core` falls through to rExplain now (every other step has its own form), so EXPLAIN holds just it.
const EXPLAIN={
  core:["Core","The reasoning engine itself. Core isn't authored — it's the runtime you point Mentor at. It reads the layers above, scores options against your objectives, routes work within governance, and escalates to humans.","Nothing to fill in — Core is set by choosing an engine (see <code>_meta/EngineAdapters.md</code>)."],
};

/* ---------- contextual help content ---------- */
const HELP={
  s_welcome:{t:"Getting started",p:["Mentor models a business as seven layers. This wizard fills in every layer except Core (the engine you choose later), with safe defaults pre-filled.","Name your business, then step through each layer. Use the chips at the top to jump around."],
    ex:"Workflow: run the wizard → download the ZIP → unzip it. It's a complete, self-contained business folder — no template to copy."},
  s_strategic:{t:"Strategic Layer",p:["The <b>why</b> of the business: a few weighted objectives that say what matters and how to trade them off when they conflict.","Keep it to 3–5. Weights are relative importance and should total <b>1.0</b>."],
    ex:"e.g. Customer Experience (0.4) · Revenue (0.35) · Efficiency (0.25)"},
  s_governance:{t:"Governance Layer",p:["The <b>guardrails</b>: what the agent may do alone, what it must propose, what needs sign-off — and the lines it must never cross.","Start cautious — put anything risky or irreversible behind <b>approve</b>. You can loosen it later as trust builds."]},
  s_learning:{t:"Learning &amp; Simulation",p:["How Mentor improves: spotting patterns, predicting risk, simulating options, and proposing spec changes. It's also what lets an action earn more autonomy over time.","Optional — add patterns, predictions and simulations here, or leave it empty and grow it later."]},
  s_core:{t:"Core",p:["The reasoning engine. It isn't authored — it's the runtime you point Mentor at. It reads the layers above, scores options against your objectives, and routes work within governance.","Set later by choosing an engine adapter."]},
  s_domain:{t:"Domain Agents",p:["The specialised agents that do the work, grouped into domains. Each may only perform the actions you allowed in Governance.","Define one or more agents here, each scoped to its allowed actions and object types. Start with one."]},
  s_objects:{t:"Operational Objects",p:["The real-world things you coordinate — customers, jobs, assets — as object <b>types</b>: you model the Customer type, not one customer. Live records live in the engine at runtime.","Define each type's key, fields, relationships and lifecycle states here."]},
  s_human:{t:"Human Collaboration",p:["The people in the loop — approvers, supervisors, escalation handlers — mapped to the approvers you named in Governance.","Add each person and map them to the Governance approver ids they fulfil, with their channels."]},
  s_generate:{t:"Generate",p:["Review the file count and any warnings, then download the ZIP — a complete, self-contained business folder.","Unzip it and open MissionControl.html inside to map and validate it. No template to copy."]},

  biz_name:{t:"Business name",p:["Names the output ZIP and the top folder. Use the real business name."],ex:"<b>Acme Plumbing</b>"},
  engine:{t:"Engine adapter",p:["Optional. The runtime Mentor will run on (Hermes Agent is one). Leave blank if undecided — it doesn't change the spec, only how it's deployed."],ex:"<b>hermes_agent</b>"},
  mission:{t:"Mission",p:["One north-star sentence: what the business is ultimately for. Everything else serves this."],ex:"<b>Deliver a premium guest experience with minimal manual effort.</b>"},
  tie_breaker:{t:"Tie-breaker",p:["When two options score almost the same, what should the agent do?","<b>escalate</b> — ask a human (safest). <b>prefer_higher_weight</b> — favour the more important objective."]},
  tie_margin:{t:"Tie margin",p:["How close counts as 'a tie', from 0 to 1.","0.05 means options within 5% of each other trigger the tie-breaker."]},
  objective:{t:"Objective",p:["A weighted, measurable goal. Give it a name, a weight, and at least one target you can actually measure."]},
  obj_name:{t:"Objective name",p:["A goal that genuinely matters to the business. A handful is plenty."],ex:"<b>Customer Experience</b>"},
  obj_weight:{t:"Weight",p:["Relative importance, 0–1. All objective weights add up to 1.0, so a higher number wins more trade-offs."],ex:"0.4 (most important) vs 0.2 (least)"},
  obj_desc:{t:"What it means",p:["One plain line describing the objective — shown on its card and in the map."],ex:"Protect reviews; resolve issues fast."},
  t_metric:{t:"Metric",p:["The thing you measure — a short, machine-ish name."],ex:"<b>satisfaction</b>, occupancy_rate, response_minutes"},
  t_op:{t:"Operator",p:["<b>&gt;=</b> at least · <b>&lt;=</b> at most · &gt; · &lt; · == exactly.","Use &gt;= for things you want high (satisfaction), &lt;= for things you want low (response time)."]},
  obj_guidance:{t:"Guidance",p:["Optional. How the agent should lean when this objective clashes with another — judgment the numbers can't capture."],ex:"Favour the customer when review risk is high."},
  approver:{t:"Approver",p:["A person who can authorise actions. Approve-tier actions point at one of these."]},
  appr_name:{t:"Approver name",p:["Who they are."],ex:"<b>Owner</b>, Duty Manager"},
  appr_channels:{t:"Channels",p:["How this person is reached for approvals and alerts."]},
  appr_can:{t:"Can approve",p:["Which actions they may sign off — a comma list of action names, or <b>all</b>."],ex:"all"},
  action:{t:"Action",p:["Something an agent might do. Pin it to a tier, say which objective it serves, and add any limits."]},
  act_name:{t:"Action name",p:["A concrete thing the agent might do."],ex:"<b>Issue refund</b>, Send reminder, Dispatch contractor"},
  act_tier:{t:"Autonomy tier",p:["<b>auto</b> — does it and logs it (low-risk, reversible). <b>recommend</b> — proposes and waits for a yes. <b>approve</b> — can't act until a named person signs off (money, irreversible, sensitive)."]},
  act_serves:{t:"Serves",p:["Which objective(s) this action advances — it links what the agent does back to <i>why</i>."]},
  act_approver:{t:"Approver",p:["Who must sign off. Only used for approve-tier actions."]},
  act_escalates:{t:"Escalates to",p:["Optional. A stricter action this one becomes once a threshold is crossed."],ex:"a small auto discount → an approve-tier refund"},
  act_limits:{t:"Limits",p:["Optional caps that keep an action safe — a maximum percentage and/or a maximum cost."],ex:"max 10% · max 150 NZD"},
  hard_rule:{t:"Hard limit",p:["An absolute, never-cross line — regardless of tier or context. Keep this list short and bright.","A hard limit is only as strong as its enforcement: back it with a hook or by withholding the tool, not words alone."],ex:"Never modify an owner payout. · Never issue a refund without approval."},
  escalation:{t:"Escalation",p:["A trigger that pulls a human in fast, overriding the normal tiers — for emergencies and stuck loops."],ex:"Safety incident → notify owner immediately, breaks quiet hours."},
  notif:{t:"Notifications",p:["Where routine messages go, and your quiet hours. Only items at or above the chosen priority break through quiet hours."]},
  audit:{t:"Audit",p:["Every action is logged with its reasoning so decisions stay explainable. Set how long to keep the logs."]},

function mcSum(fm){
  if(!fm)return"";const n=fm.mentor_node,L=fm.mentor_layer;
  if(L)return `<b>layer</b> · status: ${esc(fm.status||"?")}`;
  if(n==="objective"){const t=(fm.targets||[])[0];return `<b>weight ${esc(fm.weight)}</b>${t?` · ${fmtTgt(t)}`:""}`;}

  if(n==="operator")return `fulfils: ${esc((fm.fulfils_approvers||[]).join(", "))||"—"}`;
  if(n==="autonomy_tiers")return `tiers: ${esc(Object.keys(fm.tiers||{}).join(" · "))}`;

function mcListItems(fm){

}
function renderNodeMC(dir){

function renderVal(issues){
  if(!issues.length)return `<div class="vpanel ok">&#10003; <b>Valid</b> — all checks pass.</div>`;
  return `<div class="vpanel bad"><b>&#9888; ${issues.length} issue${issues.length>1?"s":""} to fix</b><ul>${issues.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`;
}
function renderMap(tpl,mapEl,valEl){
  MCDET=[];
  let structByIdx={};
  (function fs(d){d.files.forEach(f=>{if(f.fm&&f.fm.mentor==="structure"){(f.fm.layers||[]).forEach(l=>structByIdx[l.index]=l);}});Object.values(d.dirs).forEach(fs);})(tpl);
  const layerDirs=Object.values(tpl.dirs).filter(d=>/^\d+_/.test(d.name)).sort((a,b)=>parseInt(a.name)-parseInt(b.name));
  let html="";
  layerDirs.forEach((dir,i)=>{
    const idx=parseInt(dir.name);const nf=nodeFileMC(dir);const fm=(nf&&nf.fm)||{};const st=structByIdx[idx]||{};
    const title=(nf&&nf.title)||stripN(dir.name);const role=st.role||"";const status=fm.status||st.status||"";
    const color=MC_COLORS[(idx-1)%MC_COLORS.length];
    const statusPill=status?`<span class="pill ${status==="defined"?"green":status==="planned"?"amber":"blue"}">${esc(status)}</span>`:"";
    const bindings=(st.binding||fm.binding||[]).map(b=>`<span class="chip">${esc(b.target||b)}</span>`).join("");
    let weightBadge="";const objs=allFmsMC(dir).filter(f=>f.mentor_node==="objective");
    if(objs.length){const s=Math.round(objs.reduce((a,o)=>a+(+o.weight||0),0)*1000)/1000;weightBadge=`<span class="pill ${Math.abs(s-1)<1e-6?"green":"red"}">&Sigma; weight = ${s}</span>`;}
    const subDirs=Object.values(dir.dirs).sort(byNameMC);const extra=dir.files.filter(f=>f!==nf).sort(byNameMC);
    const children=(subDirs.length||extra.length)?`<div class="children">${subDirs.map(renderNodeMC).join("")}${extra.map(f=>`<div class="node"${mdref(f)}><h3>${esc(f.title||f.name)}</h3>${mcSum(f.fm)?`<div class="sum">${mcSum(f.fm)}</div>`:""}${mcListItems(f.fm)}</div>`).join("")}</div>`:"";
    html+=`${i>0?'<div class="conn"></div>':""}`+`<div class="layer"><div class="layer-box"${mdref(nf)} style="border-color:${color}55">`+`<div class="layer-head">`+`<div class="lv" style="color:${color};border-color:${color}66">${idx}</div>`+`<div style="flex:1"><h2>${esc(title)}</h2>`+(role?`<div class="role">${esc(role)}</div>`:"")+`<div class="meta">${statusPill}${weightBadge}${bindings}</div></div></div>`+children+`</div></div>`;
  });
  mapEl.innerHTML=html;
  valEl.innerHTML=renderVal(MentorCore.validate(tpl));
}
function renderFields(obj){
  if(obj==null)return"";
  if(Array.isArray(obj)){
    if(!obj.length)return `<span class="df-val df-muted">[ ]</span>`;
    return `<div class="df-arr">`+obj.map(it=>(it&&typeof it==="object")?`<div class="df-item">${renderFields(it)}</div>`:`<div class="df-li">${esc(String(it))}</div>`).join("")+`</div>`;
  }
  if(typeof obj==="object"){
    return Object.entries(obj).map(([k,v])=>(v&&typeof v==="object")?`<div class="df-row df-block"><div class="df-key">${esc(k)}</div>${renderFields(v)}</div>`:`<div class="df-row"><span class="df-key">${esc(k)}</span><span class="df-val">${esc(String(v))}</span></div>`).join("");
  }
  return `<span class="df-val">${esc(String(obj))}</span>`;
}
function typeLabelMC(fm){if(!fm)return"node";if(fm.mentor_layer)return"layer · "+fm.mentor_layer;if(fm.mentor==="business")return"business";if(fm.mentor==="structure")return"structure";return fm.mentor_node||"node";}
let _drawer=null;
function ensureDrawer(){
  if(_drawer)return _drawer;
  const bd=el("div",{class:"mdbackdrop",onclick:()=>closeDetailMC()});
  const aside=el("aside",{class:"mdrawer"});
  aside.innerHTML=`<div class="md-head"><div><div class="md-type"></div><h2 class="md-title"></h2><div class="md-path"></div></div><button class="md-close">&times;</button></div><div class="md-sec"><div class="md-label">Definition — frontmatter</div><div class="md-fields"></div></div><div class="md-sec"><div class="md-label">Notes</div><pre class="md-body"></pre></div>`;
  document.body.append(bd,aside);
  aside.querySelector(".md-close").addEventListener("click",()=>closeDetailMC());
  _drawer={bd,aside,type:aside.querySelector(".md-type"),title:aside.querySelector(".md-title"),path:aside.querySelector(".md-path"),fields:aside.querySelector(".md-fields"),body:aside.querySelector(".md-body")};
  return _drawer;
}
function openDetailMC(file){
  if(!file)return;const d=ensureDrawer();const fm=file.fm||{};
  d.title.textContent=file.title||file.name||"Node";d.type.textContent=typeLabelMC(fm);d.path.textContent=file.path||"";
  const keys=Object.keys(fm).filter(k=>k!=="__error");
  d.fields.innerHTML=fm.__error?`<div class="vpanel bad">YAML error: ${esc(fm.__error)}</div>`:(keys.length?renderFields(fm):`<div class="df-muted">No frontmatter.</div>`);
  d.body.textContent=(file.body||"").trim()||"—";
  d.aside.classList.add("open");d.bd.classList.add("open");
}
function closeDetailMC(){if(_drawer){_drawer.aside.classList.remove("open");_drawer.bd.classList.remove("open");}}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetailMC();});

/* shared results renderer — used by Build (in-memory) and Import (existing folder) */
function renderResults(host,arr,folder){
  const tpl=MentorCore.buildTree(arr);
  const res=MentorCore.compile(tpl);
  const bar=el("div",{class:"mres-tabs"});const body=el("div",{class:"mres"});const panes={};
  [["Map & validate","map"],["Compile & download","compile"]].forEach(([label,id],i)=>{
    const b=el("button",{class:"mres-tab"+(i===0?" on":""),onclick:()=>{[...bar.children].forEach(c=>c.classList.remove("on"));b.classList.add("on");Object.entries(panes).forEach(([k,p])=>p.style.display=k===id?"":"none");}},label);
    bar.append(b);
  });
  host.append(bar);host.append(body);
  const pMap=el("div");panes.map=pMap;
  const valEl=el("div");const mapEl=el("div");pMap.append(valEl,mapEl);
  pMap.append(el("div",{class:"small",style:"margin-top:8px"},"Tip: click any box to inspect its full definition."));
  const pCompile=el("div",{style:"display:none"});panes.compile=pCompile;
  const cprompt=el("pre",{});cprompt.textContent=res.prompt;
  pCompile.append(el("div",{class:"flexbar"},
    el("b",{},Object.keys(folder).length+" files · launch prompt + "+res.summary.agents+" skill(s)"),
    el("span",{},
      el("button",{style:"margin-right:8px",onclick:()=>{if(navigator.clipboard)navigator.clipboard.writeText(res.prompt);}},"Copy prompt"),
      el("button",{class:"primary",onclick:()=>dlDeploy(folder,res)},"Download (ready to run)"))));
  pCompile.append(el("div",{class:"note",html:"One self-contained, runnable folder: the <b>launch prompt</b> (<code>AGENTS.md</code>) and the <b>agent skills</b> sit inside it with your seven layers, plus a <code>DEPLOY.md</code>. To run it, start your engine inside the folder (with Hermes Agent: <code>cd</code> in, then <code>hermes</code>). Re-import it here any time."}));
  pCompile.append(cprompt);
  pCompile.append(el("div",{class:"mres-tags"},...Object.keys(res.files).map(f=>el("span",{class:"ftag"},f))));
  body.append(pMap,pCompile);
  renderMap(tpl,mapEl,valEl);
  mapEl.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-d]");if(!t)return;openDetailMC(MCDET[+t.getAttribute("data-d")]);});
}
function dlBlob(name,content,type){const b=new Blob([content],{type:type||"text/markdown"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);}
function dlDeploy(folder,res){
  if(typeof JSZip==="undefined"){alert("ZIP library (CDN) didn't load.");return;}
  const pkg=MentorCore.deployFiles(folder,res);   // operating model + AGENTS.md/skills/SETUP.md + DEPLOY.md, arranged inside the folder
  const zip=new JSZip();Object.entries(pkg).forEach(([p,c])=>zip.file(p,c));
  zip.generateAsync({type:"blob"}).then(b=>dlBlob((res.slug||"business")+"_deploy.zip",b,"application/zip"));
}

/* Build step (in-memory model) */
function rGenerate(host){
  const folder=MentorCore.buildBusinessFolder(state,{embed:STUDIO_EMBED});
  const arr=Object.entries(folder).map(([path,text])=>({path,text}));
  const warns=MentorCore.validateState(state);
  host.append(el("h2",{},"Generate, validate & compile"));
  host.append(el("p",{class:"lead",html:"Your complete model is built in memory. Below, in one place: the file set, a live map with validation, and the compiled engine prompt — no download, unzip, or re-pick. Grab the business folder and the engine bundle when you're happy."}));
  if(warns.length) host.append(el("div",{class:"note",html:'<span class="warn">Heads up:</span><br>• '+warns.map(esc).join("<br>• ")}));
  renderResults(host,arr,folder);
}
/* Import an existing folder → load it INTO the builder for editing, then re-export */
function openImported(arr){
  let ns;
  try{ ns=MentorCore.stateFromTree(MentorCore.buildTree(arr)); }
  catch(e){ alert("Couldn't read that folder as a Mentor model: "+e.message); return; }
  Object.keys(ns).forEach(k=>state[k]=ns[k]);   // load the parsed model into the live wizard state
  cur=0; render();
  const host=$("#step");
  host.insertBefore(el("div",{class:"note",html:"Loaded <b>"+esc(ns.business.name||"your model")+"</b> for editing — change any layer using the steps above, then open <b>Generate</b> to validate and re-export the deploy folder."}), host.firstChild);
}
(function wireImport(){
  const ip=document.getElementById("imppick");
  if(ip) ip.addEventListener("change",e=>{
    const fs2=[...e.target.files].filter(f=>f.name.toLowerCase().endsWith(".md"));
    if(!fs2.length){alert("No .md files found in that folder.");return;}
    Promise.all(fs2.map(f=>f.text().then(t=>({path:f.webkitRelativePath||f.name,text:t})))).then(openImported);
  });
})();

/* ---------- nav + help wiring ---------- */
$("#step").addEventListener("focusin",e=>{const w=e.target.closest&&e.target.closest("[data-help]");setHelp(w&&w.getAttribute("data-help")?w.getAttribute("data-help"):STEP_DEFAULT[STEPS[cur].id]);});
$("#next").addEventListener("click",()=>{ if(cur<STEPS.length-1){cur++;render();window.scrollTo(0,0);} });
$("#back").addEventListener("click",()=>{ if(cur>0){cur--;render();window.scrollTo(0,0);} });
render();
</script>
