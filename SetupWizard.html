<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mentor — Setup Wizard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0b1220; --panel:#101827; --card:#141e30; --border:rgba(148,163,184,.18);
    --text:#e5edf7; --muted:#93a4b8; --line:rgba(148,163,184,.28);
    --blue:#6d7cff; --green:#34d399; --amber:#fbbf24; --red:#fb7185;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);
    background:radial-gradient(circle at 50% 0%,rgba(109,124,255,.16),transparent 34%),var(--bg);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
  .page{max-width:1140px;margin:0 auto;padding:30px 22px 120px}
  .eyebrow{font-size:12px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted)}
  h1{margin:6px 0 0;font-size:26px;letter-spacing:-.03em}
  .rail{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 22px}
  .pip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);cursor:pointer}
  .pip.active{background:linear-gradient(135deg,var(--blue),#7c3aed);border-color:transparent;color:#fff}
  .pip.done{color:#bbf7d0;border-color:rgba(52,211,153,.4)}
  .wrap{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
  .step{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px 22px 8px;min-width:0}
  .step h2{margin:0;font-size:21px;letter-spacing:-.02em}
  .lead{color:var(--muted);line-height:1.65;margin:10px 0 4px}
  .lead b{color:#cdd7e6}
  .note{font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-radius:12px;padding:11px 13px;margin:14px 0}
  /* help panel */
  .help{position:sticky;top:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px 16px 18px;max-height:calc(100vh - 90px);overflow:auto}
  .help .tag{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);font-weight:700}
  .help h3{margin:4px 0 2px;font-size:15.5px;letter-spacing:-.01em}
  .help p{color:var(--muted);line-height:1.62;font-size:13px;margin:9px 0}
  .help p b{color:#cdd7e6}
  .help .ex{background:rgba(109,124,255,.10);border:1px solid rgba(109,124,255,.3);border-radius:10px;
    padding:9px 11px;font-size:12.5px;color:#dfe5ff;margin-top:10px;line-height:1.55}
  .help .ex b{color:#fff}
  .help code{color:#cdd7e6}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  input,select,textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:9px 11px;font:inherit;font-size:13px}
  textarea{resize:vertical;min-height:48px}
  .row{display:grid;gap:10px}
  .c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:1fr 1fr 1fr 1fr}
  .item{border:1px solid var(--border);border-radius:14px;padding:13px;margin:12px 0;background:var(--card)}
  .sub{border:1px dashed var(--line);border-radius:10px;padding:9px;margin:8px 0}
  .flexbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .chip{display:inline-flex;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;cursor:pointer;margin:2px 4px 2px 0;
    background:rgba(109,124,255,.16);border:1px solid rgba(109,124,255,.3)}
  .chip.off{background:rgba(255,255,255,.03);border-color:var(--border);color:var(--muted)}
  button{cursor:pointer;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.05);
    color:var(--text);padding:9px 14px;font-weight:700;font-size:13px}
  button.primary{border:none;background:linear-gradient(135deg,var(--blue),#7c3aed)}
  button.sm{padding:5px 9px;font-size:12px}
  button.danger{border-color:rgba(251,113,133,.4);color:#fecdd3}
  button:disabled{opacity:.5;cursor:not-allowed}
  .small{font-size:11.5px;color:var(--muted)}
  .warn{color:#fde68a}.ok{color:#bbf7d0}
  .foot{position:fixed;left:0;right:0;bottom:0;background:rgba(11,18,32,.92);border-top:1px solid var(--border);backdrop-filter:blur(6px)}
  .foot .inner{max-width:1140px;margin:0 auto;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  pre{background:#0a0f1a;border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto;font-size:11.5px;line-height:1.5;color:#cdd7e6;max-height:300px;white-space:pre-wrap}
  code{color:#cdd7e6}
  @media(max-width:860px){.wrap{grid-template-columns:1fr}.help{position:static;max-height:none;order:-1}}
</style>
</head>
<body>
<main class="page">
  <div class="eyebrow">Mentor · Setup Wizard</div>
  <h1 id="htitle">Build your operating model</h1>
  <div class="rail" id="rail"></div>
  <div class="wrap">
    <div class="step" id="step"></div>
    <aside class="help" id="help"></aside>
  </div>
</main>
<div class="foot"><div class="inner">
  <button id="back">← Back</button>
  <span class="small" id="hint"></span>
  <button id="next" class="primary">Next →</button>
</div></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const CHANNELS=["email","telegram","slack","sms","whatsapp","discord","signal","cli"];
const TIERS=["auto","recommend","approve"];
const OPS=[">=","<=",">","<","=="];
const PRIOS=["critical","high","medium","low"];
const slug=s=>String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
const q=s=>'"'+String(s==null?"":s).replace(/\\/g,"\\\\").replace(/"/g,'\\"')+'"';
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* ---------- state ---------- */
const state={
  business:{name:"",engine_adapter:""},
  strategic:{mission:"",tie_breaker:"escalate",tie_margin:0.05,
    objectives:[{name:"",description:"",weight:1,targets:[{metric:"",operator:">=",value:0,unit:""}],guidance:""}]},
  governance:{
    approvers:[{name:"",role:"",channels:["email"],can_approve:"all"}],
    actions:[{name:"",description:"",tier:"recommend",serves:[],domains:"",conditions:"",approver:0,escalates_to:-1,max_percent:"",max_cost:"",ccy:""}],
    hard_limits:[
      {rule:"Never move money, issue refunds, or change payouts without approval"},
      {rule:"Never share personal or customer data with third parties without approval"},
      {rule:"Never make legally binding commitments on the business's behalf without approval"},
      {rule:"Never make public or media statements as the business without approval"},
      {rule:"Never permanently delete or irreversibly destroy records without approval"},
      {rule:"Always disclose that you are an AI when asked"}
    ],
    escalation:[
      {trigger:"Safety, security, or legal emergency",priority:"critical",action:"Notify the responsible human immediately",oqh:true},
      {trigger:"An action fails repeatedly (~3x) or two agents disagree",priority:"medium",action:"Stop, log the reasoning, and escalate — do not retry blindly",oqh:false}
    ],
    notifications:{channels:["email"],window:"22:00-07:00",timezone:"UTC",priority:"critical"},
    audit:{retain_days:365}
  },
  objects:{types:[{name:"",key:"",fields:[{name:"",type:"text"}],relationships:[],states:""}]},
  domain:{agents:[{name:"",domain:"Operations",purpose:"",actions:[],objects:[]}]},
  human:{operators:[{name:"",role:"",fulfils:[],channels:["email"],handles:"",availability:""}]},
  learning:{patterns:[{detects:"",watches:[],suggests:""}],predictions:[{predicts:"",horizon:"",informs:[]}],simulations:[{scenario:"",compares:"",scores:[],affects:[]}]}
};

const STEPS=[
  {id:"welcome",label:"Start"},{id:"strategic",label:"1 · Strategic"},{id:"governance",label:"2 · Governance"},
  {id:"objects",label:"6 · Objects"},{id:"domain",label:"5 · Domain"},{id:"human",label:"7 · Human"},
  {id:"learning",label:"3 · Learning"},{id:"core",label:"4 · Core"},{id:"generate",label:"Generate"},
];
let cur=0;
const STEP_DEFAULT={welcome:"s_welcome",strategic:"s_strategic",governance:"s_governance",learning:"s_learning",
  core:"s_core",domain:"s_domain",objects:"s_objects",human:"s_human",generate:"s_generate"};

/* explain-only layer steps */
const EXPLAIN={
  learning:["Learning &amp; Simulation","How the system improves over time — spotting recurring issues, predicting risk, simulating options before acting, and proposing changes back to the spec. It's also what earns an action more autonomy as evidence builds.","Scaffolded as <b>planned</b> — add component folders under <code>3_LearningLayer/</code> later."],
  core:["Core","The reasoning engine itself. Core isn't authored — it's the runtime you point Mentor at. It reads the layers above, scores options against your objectives, routes work within governance, and escalates to humans.","Nothing to fill in — Core is set by choosing an engine (see <code>_meta/EngineAdapters.md</code>)."],
  domain:["Domain Agents","The specialised agents that do the work, grouped into domains (e.g. Operations, Intelligence, Communication). Each agent may only perform actions you allowed in Governance.","Scaffolded as <b>planned</b> — add agent folders under <code>5_DomainAgents/</code> when ready."],
  objects:["Operational Objects","The real-world things the business coordinates — customers, jobs, assets — as living records that accumulate history. They live in the engine's knowledge store, not in this spec.","Scaffolded as <b>planned</b> — define object types under <code>6_OperationalObjects/</code> later."],
  human:["Human Collaboration","The people in the loop — approvers, supervisors, escalation handlers. This layer maps real people to the approvers you name in Governance and the channels they're reached on.","Scaffolded as <b>planned</b> — map operators under <code>7_HumanCollaboration/</code> later."],
};

/* ---------- contextual help content ---------- */
const HELP={
  s_welcome:{t:"Getting started",p:["Mentor models a business as seven layers. This wizard fills in the two that drive behaviour — Strategic and Governance — and explains the rest.","Name your business, then step through each layer. Use the chips at the top to jump around."],
    ex:"Workflow: copy this <b>MentorTemplate</b> folder → rename it to your business → run the wizard → replace that copy's <code>1_StrategicLayer</code> &amp; <code>2_GovernanceLayer</code> with the ZIP."},
  s_strategic:{t:"Strategic Layer",p:["The <b>why</b> of the business: a few weighted objectives that say what matters and how to trade them off when they conflict.","Keep it to 3–5. Weights are relative importance and should total <b>1.0</b>."],
    ex:"e.g. Customer Experience (0.4) · Revenue (0.35) · Efficiency (0.25)"},
  s_governance:{t:"Governance Layer",p:["The <b>guardrails</b>: what the agent may do alone, what it must propose, what needs sign-off — and the lines it must never cross.","Start cautious — put anything risky or irreversible behind <b>approve</b>. You can loosen it later as trust builds."]},
  s_learning:{t:"Learning &amp; Simulation",p:["How Mentor improves: spotting patterns, predicting risk, simulating options, and proposing spec changes. It's also what lets an action earn more autonomy over time.","Nothing to enter now — it's scaffolded as <b>planned</b> and grown later."]},
  s_core:{t:"Core",p:["The reasoning engine. It isn't authored — it's the runtime you point Mentor at. It reads the layers above, scores options against your objectives, and routes work within governance.","Set later by choosing an engine adapter."]},
  s_domain:{t:"Domain Agents",p:["The specialised agents that do the work, grouped into domains. Each may only perform the actions you allowed in Governance.","Scaffolded as <b>planned</b>; add agents later."]},
  s_objects:{t:"Operational Objects",p:["The real-world things you coordinate — customers, jobs, assets — as living records with history. They live in the engine's knowledge store.","Scaffolded as <b>planned</b>; define types later."]},
  s_human:{t:"Human Collaboration",p:["The people in the loop — approvers, supervisors, escalation handlers — mapped to the approvers you named in Governance.","Scaffolded as <b>planned</b>; map people later."]},
  s_generate:{t:"Generate",p:["Review the file count and any warnings, then download the ZIP of your two populated layer folders.","Drop them into your business copy, replacing the placeholder folders."]},

  biz_name:{t:"Business name",p:["Names the output ZIP and the top folder. Use the real business name."],ex:"<b>Acme Plumbing</b>"},
  engine:{t:"Engine adapter",p:["Optional. The runtime Mentor will run on (Hermes Agent is one). Leave blank if undecided — it doesn't change the spec, only how it's deployed."],ex:"<b>hermes_agent</b>"},
  mission:{t:"Mission",p:["One north-star sentence: what the business is ultimately for. Everything else serves this."],ex:"<b>Deliver a premium guest experience with minimal manual effort.</b>"},
  tie_breaker:{t:"Tie-breaker",p:["When two options score almost the same, what should the agent do?","<b>escalate</b> — ask a human (safest). <b>prefer_higher_weight</b> — favour the more important objective."]},
  tie_margin:{t:"Tie margin",p:["How close counts as 'a tie', from 0 to 1.","0.05 means options within 5% of each other trigger the tie-breaker."]},
  objective:{t:"Objective",p:["A weighted, measurable goal. Give it a name, a weight, and at least one target you can actually measure."]},
  obj_name:{t:"Objective name",p:["A goal that genuinely matters to the business. A handful is plenty."],ex:"<b>Customer Experience</b>"},
  obj_weight:{t:"Weight",p:["Relative importance, 0–1. All objective weights add up to 1.0, so a higher number wins more trade-offs."],ex:"0.4 (most important) vs 0.2 (least)"},
  obj_desc:{t:"What it means",p:["One plain line describing the objective — shown on its card and in the map."],ex:"Protect reviews; resolve issues fast."},
  t_metric:{t:"Metric",p:["The thing you measure — a short, machine-ish name."],ex:"<b>satisfaction</b>, occupancy_rate, response_minutes"},
  t_op:{t:"Operator",p:["<b>&gt;=</b> at least · <b>&lt;=</b> at most · &gt; · &lt; · == exactly.","Use &gt;= for things you want high (satisfaction), &lt;= for things you want low (response time)."]},
  obj_guidance:{t:"Guidance",p:["Optional. How the agent should lean when this objective clashes with another — judgment the numbers can't capture."],ex:"Favour the customer when review risk is high."},
  approver:{t:"Approver",p:["A person who can authorise actions. Approve-tier actions point at one of these."]},
  appr_name:{t:"Approver name",p:["Who they are."],ex:"<b>Owner</b>, Duty Manager"},
  appr_channels:{t:"Channels",p:["How this person is reached for approvals and alerts."]},
  appr_can:{t:"Can approve",p:["Which actions they may sign off — a comma list of action names, or <b>all</b>."],ex:"all"},
  action:{t:"Action",p:["Something an agent might do. Pin it to a tier, say which objective it serves, and add any limits."]},
  act_name:{t:"Action name",p:["A concrete thing the agent might do."],ex:"<b>Issue refund</b>, Send reminder, Dispatch contractor"},
  act_tier:{t:"Autonomy tier",p:["<b>auto</b> — does it and logs it (low-risk, reversible). <b>recommend</b> — proposes and waits for a yes. <b>approve</b> — can't act until a named person signs off (money, irreversible, sensitive)."]},
  act_serves:{t:"Serves",p:["Which objective(s) this action advances — it links what the agent does back to <i>why</i>."]},
  act_approver:{t:"Approver",p:["Who must sign off. Only used for approve-tier actions."]},
  act_escalates:{t:"Escalates to",p:["Optional. A stricter action this one becomes once a threshold is crossed."],ex:"a small auto discount → an approve-tier refund"},
  act_limits:{t:"Limits",p:["Optional caps that keep an action safe — a maximum percentage and/or a maximum cost."],ex:"max 10% · max 150 NZD"},
  hard_rule:{t:"Hard limit",p:["An absolute, never-cross line — regardless of tier or context. Keep this list short and bright.","A hard limit is only as strong as its enforcement: back it with a hook or by withholding the tool, not words alone."],ex:"Never modify an owner payout. · Never issue a refund without approval."},
  escalation:{t:"Escalation",p:["A trigger that pulls a human in fast, overriding the normal tiers — for emergencies and stuck loops."],ex:"Safety incident → notify owner immediately, breaks quiet hours."},
  notif:{t:"Notifications",p:["Where routine messages go, and your quiet hours. Only items at or above the chosen priority break through quiet hours."]},
  audit:{t:"Audit",p:["Every action is logged with its reasoning so decisions stay explainable. Set how long to keep the logs."]},
  obj_type:{t:"Object type",p:["A kind of thing the business tracks. Give it a key, fields, and any relationships to other types."]},
  ot_name:{t:"Type name",p:["The entity, singular."],ex:"<b>Customer</b>, Job, Vehicle"},
  ot_key:{t:"Key",p:["The stable identifier that uniquely names one instance."],ex:"customer_id"},
  ot_rel:{t:"Relationship",p:["A link to another object type — e.g. a Job <b>belongs_to</b> a Customer, a Customer <b>has_many</b> Jobs."]},
  ot_states:{t:"Lifecycle states",p:["Optional. The stages an instance moves through, comma-separated."],ex:"open, in_progress, closed"},
  agent:{t:"Agent",p:["A specialised worker in a domain. It can only use the Governance actions you grant it."]},
  ag_name:{t:"Agent name",p:["What this agent is."],ex:"Guest agent, Scheduling agent"},
  ag_domain:{t:"Domain",p:["Which group it belongs to: Operations (doing), Intelligence (thinking), Communication (messaging)."]},
  ag_actions:{t:"Allowed actions",p:["The Governance actions this agent may perform — a subset, at the tiers Governance set."]},
  ag_objects:{t:"Object types",p:["The object types this agent reads and writes."]},
  operator:{t:"Person / role",p:["Someone in the loop — an approver, supervisor, or escalation handler."]},
  op_name:{t:"Name",p:["The person or role."],ex:"Jane (Owner), Duty Manager"},
  op_fulfils:{t:"Fulfils approver(s)",p:["Which Governance approver(s) this person actually is. Leave empty for non-approvers (e.g. escalation-only)."]},
  op_channels:{t:"Channels",p:["How they're reached for approvals and alerts."]},
  op_handles:{t:"Handles",p:["What they're responsible for, comma-separated."],ex:"refund sign-off, after-hours emergencies"},
  l_pattern:{t:"Pattern",p:["A recurring issue to watch for in the object history, and the improvement to propose when it recurs."]},
  l_prediction:{t:"Prediction",p:["A forecast of a metric over a horizon that helps protect an objective ahead of time."]},
  l_simulation:{t:"Simulation",p:["A what-if: compare options scored against your objectives before changing how an action is used."]},
};
function setHelp(key){
  const h=HELP[key]||HELP[STEP_DEFAULT[STEPS[cur].id]];
  const box=$("#help");
  if(!h){box.innerHTML="";return;}
  box.innerHTML=`<div class="tag">Help</div><h3>${h.t}</h3>`+(h.p||[]).map(p=>`<p>${p}</p>`).join("")+(h.ex?`<div class="ex">${h.ex}</div>`:"");
}

/* ---------- DOM helpers ---------- */
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x==="class")e.className=a[x];else if(x.startsWith("on"))e.addEventListener(x.slice(2),a[x]);else if(x==="html")e.innerHTML=a[x];else e.setAttribute(x,a[x]);}k.flat().forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c==null?"":c)));return e;};
const field=(l,inp,help)=>el("div",help?{"data-help":help}:{},el("label",{},l),inp);
function inp(v,on,o={}){const i=el("input",{value:v==null?"":v});if(o.type)i.type=o.type;if(o.ph)i.placeholder=o.ph;i.addEventListener("input",()=>on(o.type==="number"?(i.value===""?"":parseFloat(i.value)):i.value));return i;}
function sel(v,opts,on){const s=el("select");opts.forEach(o=>{const op=el("option",{value:o},o);if(o===v)op.selected=true;s.append(op);});s.addEventListener("change",()=>on(s.value));return s;}
function chips(all,selected,on){const w=el("div");all.forEach(o=>{w.append(el("span",{class:"chip"+(selected.includes(o)?"":" off"),onclick:()=>{const i=selected.indexOf(o);i>=0?selected.splice(i,1):selected.push(o);on();}},o));});return w;}
function selKV(val,pairs,on){const s=el("select");pairs.forEach(([v,l])=>{const op=el("option",{value:v},l);if(String(v)===String(val))op.selected=true;s.append(op);});s.addEventListener("change",()=>on(s.value));return s;}
function multiIdx(items,selArr,labelFn,on){const w=el("div");if(!items.length){w.append(el("span",{class:"small"},"(none defined in an earlier step yet)"));return w;}items.forEach((it,i)=>{const onn=selArr.includes(i);w.append(el("span",{class:"chip"+(onn?"":" off"),onclick:()=>{const k=selArr.indexOf(i);k>=0?selArr.splice(k,1):selArr.push(i);on();}},labelFn(it,i)));});return w;}

/* ---------- render ---------- */
function renderRail(){
  const r=$("#rail");r.innerHTML="";
  STEPS.forEach((s,i)=>r.append(el("span",{class:"pip"+(i===cur?" active":i<cur?" done":""),onclick:()=>{cur=i;render();}},s.label)));
}
function render(){
  renderRail();
  const id=STEPS[cur].id, host=$("#step");host.innerHTML="";
  ({welcome:rWelcome,strategic:rStrategic,governance:rGovernance,objects:rObjects,domain:rDomain,human:rHuman,learning:rLearning,generate:rGenerate}[id]||rExplain)(host,id);
  $("#back").disabled=cur===0;
  $("#next").style.display=cur===STEPS.length-1?"none":"";
  $("#hint").textContent="";
  setHelp(STEP_DEFAULT[id]);
}

function rWelcome(host){
  host.innerHTML="";
  host.append(el("h2",{},"Welcome"));
  host.append(el("p",{class:"lead",html:"This wizard walks Mentor's seven layers and builds a starter operating model. We ask real questions for <b>Strategic</b> (what the business is trying to achieve) and <b>Governance</b> (what the system may do on its own), and explain the rest. At the end you get a ZIP of the two populated layer folders."}));
  host.append(field("Business name",inp(state.business.name,v=>state.business.name=v,{ph:"e.g. Acme Co"}),"biz_name"));
  host.append(field("Engine adapter (optional)",inp(state.business.engine_adapter,v=>state.business.engine_adapter=v,{ph:"e.g. hermes_agent — leave blank if undecided"}),"engine"));
  host.append(el("div",{class:"note",html:"At the end you'll get a <b>complete business folder</b> as a ZIP — every layer plus the reference docs and Mission Control, ready to open. No template to copy."}));
}

function rStrategic(host){
  host.innerHTML="";
  const s=state.strategic;
  host.append(el("h2",{},"Strategic Layer"));
  host.append(el("p",{class:"lead",html:"The <b>why</b>. A small set of weighted, measurable <b>objectives</b> that say what the business is trying to achieve, and how to weigh them when they pull against each other. Keep it to 3–5. Weights should add up to 1.0."}));
  host.append(field("Mission — one north-star sentence",inp(s.mission,v=>s.mission=v,{ph:"e.g. Deliver a premium service with minimal manual effort"}),"mission"));
  const wr=el("div",{class:"row c2"});
  wr.append(field("Tie-breaker when scores are close",sel(s.tie_breaker,["escalate","prefer_higher_weight"],v=>s.tie_breaker=v),"tie_breaker"));
  wr.append(field("Tie margin",inp(s.tie_margin,v=>s.tie_margin=v,{type:"number"}),"tie_margin"));
  host.append(wr);

  const sumSpan=el("span",{class:"small"});
  const updSum=()=>{const x=s.objectives.reduce((a,o)=>a+(+o.weight||0),0),v=Math.round(x*1000)/1000,ok=Math.abs(x-1)<1e-9;
    sumSpan.className=(ok?"ok":"warn")+" small";sumSpan.textContent="weight total: "+v+(ok?" ✓":" (aim for 1.0)");};
  updSum();
  host.append(el("div",{class:"flexbar"},el("h2",{style:"font-size:16px"},"Objectives"),sumSpan));
  s.objectives.forEach((o,i)=>{
    const c=el("div",{class:"item","data-help":"objective"});

  const actMeta=state.governance.actions.map((a,i)=>({...a,folder:"Action"+(i+1),id:slug(a.name)||("action_"+(i+1))}));

  const s=state.strategic;
  out["1_StrategicLayer/StrategicLayer.md"]=
`---
mentor_layer: strategic
index: 1
status: defined
weighting:
  weights_sum_to: 1.0
  tie_breaker: ${s.tie_breaker}
  tie_margin: ${s.tie_margin}
  governance_supersedes_strategy: true
mission: ${q(s.mission)}
---

# Strategic Layer

What the business is trying to achieve, as weighted, measurable objectives. Weights sum to 1.0.

| objective (folder) | weight | about |
| --- | --- | --- |
${objMeta.map(o=>`| \`${o.folder}\` | ${o.weight} | ${(o.description||"").replace(/\|/g,"\\|")} |`).join("\n")}
`;
  objMeta.forEach(o=>{
    out[`1_StrategicLayer/${o.folder}/${o.folder}.md`]=
`---
mentor_node: objective
layer: strategic
id: ${o.id}
label: ${q(o.label)}
weight: ${o.weight}
targets:
${(o.targets||[]).map(t=>`  - { metric: ${q(t.metric)}, operator: ${q(t.operator)}, value: ${t.value===""?0:t.value}, unit: ${q(t.unit)} }`).join("\n")||"  []"}
guidance: ${q(o.guidance)}
---

# ${o.label}

${o.description||""}

| metric | target |
| --- | --- |
${(o.targets||[]).map(t=>`| ${t.metric||""} | ${t.operator||""} ${t.value===""?0:t.value} ${t.unit||""} |`).join("\n")}
`;
  });

  const g=state.governance;
  out["2_GovernanceLayer/GovernanceLayer.md"]=
`---
mentor_layer: governance
index: 2
status: defined
autonomy_tiers: [auto, recommend, approve]
---

# Governance Layer

What the agent may do alone (auto), propose (recommend), or needs sign-off for (approve), plus the never-do hard limits.
`;

`---
mentor_node: autonomy_tiers
layer: governance
tiers:
  auto: "Agent acts immediately and logs it."
  recommend: "Agent proposes; acts only on confirmation."
  approve: "Agent may not act until a named approver signs off."
---

# Autonomy Tiers

Every action is pinned to one tier: **auto**, **recommend**, or **approve**.
`;
  out["2_GovernanceLayer/Approvers/Approvers.md"]=
`---
mentor_node: approvers_index
layer: governance
---

# Approvers

| approver (folder) | role |
| --- | --- |
${apprMeta.map(a=>`| \`${a.folder}\` | ${a.role||""} |`).join("\n")}

    {id:"strategic",index:1,role:"Express intent as weighted objectives + a trade-off policy",kind:"definition",status:"defined",inputs_from:[],outputs_to:[{layer:"governance",contract:"objective ids that action policies may serve"},{layer:"core",contract:"objective weights + trade-off policy"}],spec:"1_StrategicLayer/StrategicLayer.md",owns:["mission","weighting","objectives"],references:[],binding:[{target:"durable_context",mode:"at_startup"}]},
    {id:"governance",index:2,role:"Authority: tiers, action policies, hard limits, escalation",kind:"definition",status:"defined",inputs_from:["strategic"],outputs_to:[{layer:"core",contract:"permitted actions + tiers"},{layer:"domain",contract:"the action policies each agent may perform"}],spec:"2_GovernanceLayer/GovernanceLayer.md",owns:["autonomy_tiers","actions","hard_limits","approvers","escalation"],references:["objectives"],binding:[{target:"durable_context",mode:"at_startup"},{target:"enforcement",mode:"event"}]},
    {id:"learning",index:3,role:"Detect patterns, predict, simulate, propose improvements",kind:"definition",status:has.learning?"defined":"planned",inputs_from:["strategic","governance"],outputs_to:[{layer:"core",contract:"recommendations, predicted impacts, autonomy-promotion evidence"}],spec:"3_LearningLayer/LearningLayer.md",owns:["patterns","predictions","simulations"],references:["objectives","actions","object_types"],binding:[{target:"knowledge_store",mode:"on_demand"},{target:"procedure",mode:"on_demand"},{target:"schedule",mode:"scheduled"}]},
    {id:"core",index:4,role:"Orchestrate: score against intent, route within authority",kind:"engine",status:"defined",inputs_from:["strategic","governance","learning"],outputs_to:[{layer:"domain",contract:"tasked, tier-bounded work assignments"}],spec:"4_CoreLayer/CoreLayer.md",owns:["routing"],references:["objectives","actions","agents"],binding:[{target:"engine",mode:"at_startup"}]},
    {id:"domain",index:5,role:"Specialised agents that do the work",kind:"operating",status:has.domain?"defined":"planned",inputs_from:["governance","core"],outputs_to:[{layer:"objects",contract:"reads/writes to operational object state"}],spec:"5_DomainAgents/DomainAgents.md",owns:["domains","agents"],references:["actions","object_types"],binding:[{target:"agent",mode:"on_demand"},{target:"procedure",mode:"on_demand"}]},
    {id:"objects",index:6,role:"Real-world entities as living nodes with history",kind:"data",status:has.objects?"defined":"planned",inputs_from:["domain"],outputs_to:[{layer:"human",contract:"surfaced state, pressure, history"}],spec:"6_OperationalObjects/OperationalObjects.md",owns:["object_types"],references:[],binding:[{target:"knowledge_store",mode:"on_demand"},{target:"fact_memory",mode:"at_startup"}]},
    {id:"human",index:7,role:"Approvers, supervisors, escalation handlers",kind:"interface",status:has.human?"defined":"planned",inputs_from:["governance","objects"],outputs_to:[],spec:"7_HumanCollaboration/HumanCollaboration.md",owns:["operators"],references:["approvers"],binding:[{target:"channel",mode:"on_demand"},{target:"enforcement",mode:"event"},{target:"schedule",mode:"scheduled"}]}
  ];
}
function buildStructureMd(state){
  const layers=structureLayers(state);
  const fm={mentor:"structure",schema_version:0.3,engine_adapter:state.business.engine_adapter||null,layers};
  const rows=layers.map(l=>`| ${l.index} | ${l.id} | ${l.status} |`).join("\n");
  return "---\n"+jsyaml.dump(fm,{lineWidth:100,noRefs:true,sortKeys:false})+"---\n\n# Structure\n\nThe seven-layer descriptor set for this business (the frontmatter is the source of truth).\n\n| # | layer | status |\n| - | --- | --- |\n"+rows+"\n";
}
function buildBusinessFolder(state){
  const name=state.business.name||"Business";
  const s=slug(name)||"business";
  const out={};
  const put=(p,c)=>{out[s+"/"+p]=c;};
  put(s+".md", `---\nmentor: business\nname: ${q(name)}\nengine_adapter: ${state.business.engine_adapter?q(state.business.engine_adapter):"null"}\ntemplate_version: 0.3\n---\n\n# ${name}\n\nA Mentor operating model generated by the Setup Wizard. New here? Read \`_meta/Playbook.md\`.\n`);
  Object.entries(PLANNED_STUBS).forEach(([p,c])=>put(p,c));
  Object.entries(buildFiles(state)).forEach(([p,c])=>put(p,c));
  put("4_CoreLayer/CoreLayer.md", CORE_STUB);
  put("_meta/Structure.md", buildStructureMd(state));
  Object.entries(EMBEDDED).forEach(([p,b64])=>put(p, utf8FromB64(b64)));
  return out;
}

/* ---------- soft validation ---------- */
function validateState(state){
  const w=[];
  const sum=state.strategic.objectives.reduce((a,o)=>a+(+o.weight||0),0);
  if(Math.abs(sum-1)>1e-6) w.push(`Objective weights add up to ${Math.round(sum*1000)/1000}, not 1.0.`);
  state.strategic.objectives.forEach((o,i)=>{if(!o.name)w.push(`Objective ${i+1} has no name.`);});
  if(!state.governance.approvers.some(a=>a.name)) w.push("No approver has a name.");
  state.governance.actions.forEach((a,i)=>{
    if(a.tier==="approve"&&!(state.governance.approvers[a.approver]||{}).name) w.push(`Action ${i+1} needs sign-off but its approver is unnamed.`);
    if(!(a.serves||[]).length) w.push(`Action ${i+1} doesn't serve any objective.`);
  });
  if(!state.governance.hard_limits.some(h=>h.rule)) w.push("No hard limits set.");
  if(state.domain.agents.some(a=>a.name&&!a.actions.length)) w.push("An agent has a name but no allowed actions.");
  if(state.human.operators.some(o=>o.name&&!o.fulfils.length&&!o.handles)) w.push("An operator has no approver and no responsibilities.");
  return w;
}

/* ---------- zip ---------- */
function downloadZip(folder){
  if(typeof JSZip==="undefined"){alert("ZIP library (JSZip CDN) didn't load — check your connection.");return;}
  const zip=new JSZip();
  Object.entries(folder).forEach(([p,c])=>zip.file(p,c));
  zip.generateAsync({type:"blob"}).then(blob=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=(slug(state.business.name)||"business")+".zip";a.click();URL.revokeObjectURL(a.href);
  });
}

/* ---------- nav + help wiring ---------- */
$("#step").addEventListener("focusin",e=>{const w=e.target.closest&&e.target.closest("[data-help]");setHelp(w&&w.getAttribute("data-help")?w.getAttribute("data-help"):STEP_DEFAULT[STEPS[cur].id]);});
$("#next").addEventListener("click",()=>{ if(cur<STEPS.length-1){cur++;render();window.scrollTo(0,0);} });
$("#back").addEventListener("click",()=>{ if(cur>0){cur--;render();window.scrollTo(0,0);} });
render();
